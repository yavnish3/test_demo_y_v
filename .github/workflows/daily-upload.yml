name: YouTube Upload Every 6h

on:
  schedule:                     # har 6 ghante mein 1 video (roz 4)
    - cron: "17 */6 * * *"      # 05:47, 11:47, 17:47, 23:47 IST
  workflow_dispatch:            # Actions tab se manually bhi chala sakte ho
    inputs:
      count:
        description: "Kitne videos upload karne hain"
        default: "1"

concurrency:
  group: youtube-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Upload videos
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          VIDEO_PRIVACY: ${{ vars.VIDEO_PRIVACY || 'private' }}
          PLAYLIST_TITLE: ${{ vars.PLAYLIST_TITLE || 'AI Shorts' }}
          MADE_FOR_KIDS: ${{ vars.MADE_FOR_KIDS || 'false' }}
          SKIP_IDS: ${{ vars.SKIP_IDS }}
          COUNT: ${{ inputs.count || vars.PER_RUN_COUNT || '1' }}
        run: python uploader.py upload --count "$COUNT"

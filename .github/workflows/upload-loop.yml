name: YouTube Upload Loop

# Ek baar Actions tab se "Run workflow" dabao. Har run 1 video upload karta hai,
# phir intezaar karke khud ko dobara chalata hai — jab tak saare videos upload na ho jayein.
on:
  workflow_dispatch:
    inputs:
      interval_minutes:
        description: "Har run ke beech kitne minute (max 350 ≈ 6 ghante)"
        default: "350"
      count:
        description: "Har run mein har channel pe kitne videos"
        default: "1"

concurrency:
  group: youtube-upload
  cancel-in-progress: false

permissions:
  contents: write         # AI se bane naye props repo mein save karne ke liye
  actions: write          # agla run khud start karne ke liye

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      remaining: ${{ steps.up.outputs.remaining }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ───── nayi stickman video (Grok kahani -> render -> Drive) ─────
      - name: Stickman tools
        if: vars.STICKMAN_AUTO != 'false' && hashFiles('STOP') == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core libraqm0 > /dev/null
          pip install -r stickman/requirements.txt
          python -c "from PIL import features; assert features.check('raqm'), 'raqm missing (Hindi text)'"

      - name: Cache OpenMoji
        if: vars.STICKMAN_AUTO != 'false' && hashFiles('STOP') == ''
        uses: actions/cache@v4
        with:
          path: stickman/assets
          key: openmoji-17.0.0

      - name: Make stickman video
        if: vars.STICKMAN_AUTO != 'false' && hashFiles('STOP') == ''
        continue-on-error: true          # ye fail ho toh bhi purane videos upload hote rahein
        timeout-minutes: 25
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python stickman/auto.py

      - name: Save new AI props
        if: vars.STICKMAN_AUTO != 'false' && hashFiles('STOP') == ''
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain stickman/props_ai)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stickman/props_ai
            git commit -m "Add AI-generated stickman props"
            git pull --rebase -q && git push -q
          fi

      - name: Upload video
        id: up
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          GOOGLE_TOKEN_2: ${{ secrets.GOOGLE_TOKEN_2 }}
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          VIDEO_PRIVACY: ${{ vars.VIDEO_PRIVACY || 'public' }}
          PLAYLIST_TITLE: ${{ vars.PLAYLIST_TITLE || 'AI Shorts' }}
          MADE_FOR_KIDS: ${{ vars.MADE_FOR_KIDS || 'false' }}
          SKIP_IDS: ${{ vars.SKIP_IDS }}
          STICKMAN_AUTO: ${{ vars.STICKMAN_AUTO != 'false' }}
          DELETE_AFTER_UPLOAD: ${{ vars.DELETE_AFTER_UPLOAD || 'true' }}
          COUNT: ${{ inputs.count || '1' }}
        run: |
          if [ -f STOP ]; then
            echo "🛑 Repo mein STOP file hai — loop band. Dobara chalane ke liye STOP file delete karo."
            echo "remaining=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$COUNT" =~ ^[0-9]+$ ]] || COUNT=1
          python uploader.py upload --count "$COUNT"

  next:
    needs: upload
    # ek video fail bhi ho toh loop chalta rahe; par script crash ho (remaining khaali) ya sab ho gaye (0) toh ruk jaye
    if: always() && needs.upload.outputs.remaining != '' && needs.upload.outputs.remaining != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      INTERVAL: ${{ inputs.interval_minutes || '350' }}
      COUNT: ${{ inputs.count || '1' }}
      REMAINING: ${{ needs.upload.outputs.remaining }}
    steps:
      - name: Wait
        run: |
          [[ "$INTERVAL" =~ ^[0-9]+$ ]] || INTERVAL=350
          m=$(( INTERVAL > 350 ? 350 : INTERVAL )); m=$(( m < 1 ? 1 : m ))
          echo "📊 Baaki videos: $REMAINING"
          echo "⏳ $m minute baad agla video..."
          sleep $(( m * 60 ))

      - name: Start next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$INTERVAL" =~ ^[0-9]+$ ]] || INTERVAL=350
          [[ "$COUNT" =~ ^[0-9]+$ ]] || COUNT=1
          gh workflow run upload-loop.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f interval_minutes="$INTERVAL" -f count="$COUNT"
          echo "🔁 Agla run start ho gaya"
